{% extends "base.html" %}

{% block title %}Input Data Pelanggan - Customer Segmentation{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-gray-800">Input Data Pelanggan</h1>

    <form method="POST" action="/segment" class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Gender -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600">Gender</label>
                <select name="gender" required class="w-full bg-gray-50 border border-gray-200 text-xs rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>Pilih gender pelanggan...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- Age -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600">Age (Usia)</label>
                <input type="number" name="age" required placeholder="Masukkan usia pelanggan..." class="w-full bg-gray-50 border border-gray-200 text-xs rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Annual Income -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600">Annual Income (k$)</label>
                <input type="number" name="annual_income" required placeholder="Masukkan pendapatan tahunan (k$)..." class="w-full bg-gray-50 border border-gray-200 text-xs rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Spending Score -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-gray-600">Spending Score (1-100)</label>
                <input type="number" name="spending_score" min="1" max="100" required placeholder="Masukkan skor belanja (1-100)..." class="w-full bg-gray-50 border border-gray-200 text-xs rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Warning Notice -->
        <div class="flex items-center gap-2 text-xs text-blue-500 bg-blue-50/50 p-3 rounded-xl">
            <i class="fa-solid fa-circle-info"></i>
            <span>Pastikan semua data diisi dengan benar sebelum memproses segmentasi.</span>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-6 py-3 rounded-xl flex items-center gap-2 shadow-sm transition">
                <i class="fa-solid fa-floppy-disk"></i>
                Simpan
            </button>
        </div>
    </form>
</div>
{% endblock %}
