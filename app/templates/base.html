<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Segmentation{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between shrink-0">
            <div>
                <!-- Logo -->
                <div class="h-16 flex items-center px-6 border-b border-gray-100">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">LOGO</div>
                        <span class="font-bold text-gray-700 text-lg">App System</span>
                    </div>
                </div>
                
                <!-- Nav Links -->
                <nav class="p-4 space-y-1">
                    <a href="/" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition {% if request.url.path == '/' %}bg-blue-50 text-blue-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                        <i class="fa-solid fa-border-all text-base"></i>
                        Dashboard
                    </a>
                    <a href="/history" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition {% if request.url.path in ['/history', '/segment'] or '/result' in request.url.path or '/update' in request.url.path %}bg-blue-50 text-blue-600{% else %}text-gray-600 hover:bg-gray-50{% endif %}">
                        <i class="fa-solid fa-users text-base"></i>
                        Segmentasi
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <!-- Top Navbar Header -->
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 sticky top-0 z-10">
                <button class="text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-gray-600">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                </div>
            </header>

            <!-- Page Content Body -->
            <main class="p-8 flex-1">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
